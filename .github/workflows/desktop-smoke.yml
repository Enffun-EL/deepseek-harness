# PR/push gate for DSH Desktop: unit tests + Host readiness smoke + Electron binary smoke.
#
# Path-filtered so ordinary harness PRs do not pay desktop runner cost. Host smoke
# uses the source CLI via tsx (same fallback as desktop dev) and does not require a
# full monorepo `pnpm run build`. Electron binary download failures soft-fail only;
# a present binary that fails `--version` still fails the job.
name: Desktop Smoke

'on':
  pull_request:
    paths:
      - '.github/workflows/desktop-smoke.yml'
      - '.github/workflows/desktop-release.yml'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop-smoke.yml'
      - '.github/workflows/desktop-release.yml'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop-smoke:
    name: desktop smoke / ${{ matrix.os }}
    # macOS is best-effort until packaging/signing and runner capacity settle.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Windows runners use native pwsh per .github/AGENTS.md.
      - name: Configure pnpm store path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $storeRoot = Join-Path $env:LOCALAPPDATA 'pnpm\store'
          Add-Content -Path $env:GITHUB_ENV -Value "PNPM_CONFIG_STORE_DIR=$storeRoot"
          $storePath = & pnpm store path --silent
          Add-Content -Path $env:GITHUB_ENV -Value "DSH_PNPM_STORE_PATH=$storePath"

      - name: Configure pnpm store path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "DSH_PNPM_STORE_PATH=$store_path" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.DSH_PNPM_STORE_PATH }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Test desktop package
        run: pnpm --filter @deepseek-ai/dsh-desktop test

      # Source-CLI Host path (tsx). Full monorepo build is intentionally skipped:
      # smoke:host falls back the same way as desktop dev when apps/cli/lib is absent.
      - name: Smoke host readiness
        run: pnpm --filter @deepseek-ai/dsh-desktop run smoke:host

      # Exit 2 = Electron binary missing (download/postinstall gap) → warning only.
      # Any other non-zero fails the job when the binary is present but broken.
      - name: Smoke electron binary
        shell: bash
        run: |
          set +e
          pnpm --filter @deepseek-ai/dsh-desktop run smoke:electron
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::Electron binary missing or undownloaded; soft-failing smoke:electron only"
            exit 0
          fi
          echo "smoke:electron failed with exit code $code"
          exit "$code"
