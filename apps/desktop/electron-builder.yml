# electron-builder configuration for @deepseek-ai/dsh-desktop (v24.x).
# Pinned below v25+ so the workspace supply-chain gate does not pull
# @electron/rebuild → git:@electron/node-gyp (blocked exotic subdependency).
# Builds the Electron shell + staged Host runtime under resources/host
# (ensure-host-dist product mode: portable Node + pnpm-deployed dsh closure).

appId: ai.deepseek.dsh.desktop
productName: DSH Desktop
copyright: Copyright © DeepSeek

# Compiled main process (tsc → lib/). Do not pack tests or TypeScript sources.
directories:
  output: release
  buildResources: build

files:
  - lib/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!tests/**'
  - '!src/**'
  - '!release/**'
  - '!host-dist/**'
  - '!build/**'

# Product Host runtime from ensure-host-dist (portable Node + deployed dsh
# closure + run-host.mjs). Copied as resources/host; resolveHostRoot prefers it.
extraResources:
  - from: host-dist
    to: host
    filter:
      - '**/*'
    # electron-builder 24+ requires the path to exist when listed.
    # `pnpm run ensure-host-dist` always creates host-dist before pack/dist.

asar: true

# Never publish from local pack scripts; CI/release owns distribution.
publish: null

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Code signing / notarization are release-pipeline concerns; unsigned local DMGs are expected.

dmg:
  writeUpdateInfo: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
